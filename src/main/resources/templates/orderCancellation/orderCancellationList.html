<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주문 취소 요청 목록</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f5f6f8; color: #253041; font-family: system-ui, sans-serif; }
        main { max-width: 1500px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 26px; margin: 0 0 8px; }
        .description { color: #667085; margin: 0 0 24px; }
        .panel { border: 1px solid #e1e5eb; border-radius: 10px; background: white; overflow: hidden; }
        .toolbar, .pagination { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; padding: 20px; }
        form, .links { display: flex; align-items: center; gap: 8px; }
        input, button, .links a, .disabled { font: inherit; padding: 8px 12px; border: 1px solid #d6dce5; border-radius: 6px; background: white; color: inherit; }
        input { width: 80px; }
        button, .links a { cursor: pointer; text-decoration: none; }
        button:hover, .links a:hover { background: #f0f3f8; }
        .disabled { color: #9299a5; background: #f7f8fa; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #edf0f4; }
        th { background: #f8f9fb; color: #667085; font-weight: 600; }
        .reason { min-width: 180px; max-width: 300px; white-space: normal; overflow-wrap: anywhere; }
        .badge { display: inline-block; padding: 5px 9px; border-radius: 5px; background: #eef2f7; }
        .badge.failed { color: #b42318; background: #fef3f2; }
        .badge.complete { color: #067647; background: #ecfdf3; }
        .empty { padding: 56px 16px; text-align: center; color: #667085; }
        .page-info { color: #667085; font-size: 14px; }
        .detail-button:disabled { cursor: not-allowed; color: #9299a5; background: #f7f8fa; }
        .detail-note { margin: 6px 0 0; color: #667085; font-size: 12px; }
        @media (max-width: 600px) { main { margin: 24px auto; padding: 0 12px; } .toolbar, .pagination { padding: 16px; } }
        dialog { width: min(1000px, 94vw); max-height: 88vh; border: 0; border-radius: 12px; padding: 24px; color: #253041; }
        dialog::backdrop { background: rgb(0 0 0 / 40%); }
        .dialog-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        dialog h2 { margin: 0; font-size: 22px; }
        dialog h3 { margin: 24px 0 14px; font-size: 17px; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .detail-grid dt { color: #667085; font-size: 13px; margin-bottom: 5px; }
        .detail-grid dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        .cancel-actions { display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 12px; padding: 16px 0; border-bottom: 1px solid #e1e5eb; }
        .cancel-actions p { margin: 0; color: #667085; font-size: 13px; }
        .cancel-process { color: #b42318; border-color: #fda29b; background: #fff5f5; font-weight: 600; }
        .cancel-process:disabled { cursor: not-allowed; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<main>
    <h1>주문 취소 요청 목록</h1>
    <p class="description">접수된 주문 취소 요청과 처리 상태를 확인합니다.</p>
    <section class="panel" aria-label="주문 취소 요청">
        <div class="toolbar">
            <div>전체 <strong th:text="${orderCancelPages.totalElements}">0</strong>건</div>
            <form method="get" th:action="@{/api/admin/cancel}">
                <input type="hidden" name="page" value="0">
                <label for="size">페이지당</label>
                <input id="size" name="size" type="number" min="1" max="100" required th:value="${orderCancelPages.size}">
                <span>건</span>
                <button type="submit">조회</button>
            </form>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th scope="col">취소 ID</th>
                    <th scope="col">주문번호</th>
                    <th scope="col">출고번호</th>
                    <th scope="col">출고 상태</th>
                    <th scope="col">취소 상태</th>
                    <th scope="col">취소 사유</th>
                    <th scope="col">요청 시간</th>
                    <th scope="col">최종 변경 시간</th>
                    <th scope="col">완료 시간</th>
                    <th scope="col">처리 관리자</th>
                    <th scope="col">상세정보</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cancel : ${orderCancelPages.content}">
                    <td th:text="${cancel.cancelId}">-</td>
                    <td th:text="${cancel.orderNumber}">-</td>
                    <td th:text="${cancel.outboundNumber}">-</td>
                    <td th:text="${cancel.outboundStatus}">-</td>
                    <td><span class="badge" th:text="${cancel.cancelStatus}"
                              th:classappend="${cancel.cancelStatus == '취소 실패' ? 'failed' : (cancel.cancelStatus == '취소 처리 완료' ? 'complete' : '')}">-</span></td>
                    <td class="reason" th:text="${#strings.isEmpty(cancel.cancelReason) ? '-' : cancel.cancelReason}">-</td>
                    <td th:text="${cancel.requestedAt != null ? #temporals.format(cancel.requestedAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                    <td th:text="${cancel.updatedAt != null ? #temporals.format(cancel.updatedAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                    <td th:text="${cancel.completedAt != null ? #temporals.format(cancel.completedAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                    <td th:text="${#strings.isEmpty(cancel.admin) ? '-' : cancel.admin}">-</td>
                    <td>
                        <button type="button" class="detail-button"
                                th:data-cancel-id="${cancel.cancelId}"
                                th:data-detail-url="@{/api/admin/cancel/detail/{id}(id=${cancel.cancelId})}"
                                th:attr="aria-label=|취소 요청 ${cancel.cancelId} 상세보기|">상세보기</button>

                    </td>
                </tr>
                <tr th:if="${orderCancelPages.empty}">
                    <td colspan="11" class="empty">이 페이지에 표시할 취소 요청이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav class="pagination" aria-label="취소 요청 목록 페이지 이동">
            <span class="page-info" th:text="|현재 ${orderCancelPages.totalPages == 0 ? 0 : orderCancelPages.number + 1} / 전체 ${orderCancelPages.totalPages}페이지|">현재 0 / 전체 0페이지</span>
            <div class="links">
                <a th:if="${orderCancelPages.hasPrevious()}" th:href="@{/api/admin/cancel(page=0, size=${orderCancelPages.size})}">처음</a>
                <a th:if="${orderCancelPages.hasPrevious()}" th:href="@{/api/admin/cancel(page=${orderCancelPages.number - 1}, size=${orderCancelPages.size})}">이전</a>
                <span th:unless="${orderCancelPages.hasPrevious()}" class="disabled" aria-disabled="true">이전</span>
                <a th:if="${orderCancelPages.hasNext()}" th:href="@{/api/admin/cancel(page=${orderCancelPages.number + 1}, size=${orderCancelPages.size})}">다음</a>
                <span th:unless="${orderCancelPages.hasNext()}" class="disabled" aria-disabled="true">다음</span>
            </div>
        </nav>
    </section>
</main>
<dialog id="cancel-detail" aria-labelledby="detail-title">
    <div class="dialog-header">
        <h2 id="detail-title">주문 취소 상세정보</h2>
        <form method="dialog"><button type="submit" autofocus>닫기</button></form>
    </div>
    <p id="detail-message" role="status" aria-live="polite"></p>
    <button id="detail-retry" type="button" hidden>다시 조회</button>
    <div id="detail-content"></div>
</dialog>
<script>
    const dialog = document.getElementById('cancel-detail');
    const content = document.getElementById('detail-content');
    const message = document.getElementById('detail-message');
    const retry = document.getElementById('detail-retry');
    let activeButton;
    let requestController;
    const display = value => value == null || value === '' ? '-' : String(value);
    const date = value => value ? String(value).replace('T', ' ') : '-';
    const money = value => value == null ? '미확인' : Number(value).toLocaleString('ko-KR') + '원';
    function section(title, fields) {
        const section = document.createElement('section');
        const heading = document.createElement('h3');
        heading.textContent = title;
        const list = document.createElement('dl');
        list.className = 'detail-grid';
        fields.forEach(([label, value]) => {
            const wrapper = document.createElement('div');
            const term = document.createElement('dt');
            const description = document.createElement('dd');
            term.textContent = label;
            description.textContent = display(value);
            wrapper.append(term, description);
            list.append(wrapper);
        });
        section.append(heading, list);
        content.append(section);
    }
    function render(data) {
        section('취소 처리 정보', [
            ['취소 ID', data.cancelId], ['주문번호', data.orderNumber], ['출고번호', data.outboundNumber],
            ['주문 상태', data.orderStatus], ['출고 상태', data.outboundStatus], ['취소 상태', data.cancelStatus],
            ['취소 사유', data.cancelReason], ['실패 사유', data.failReason], ['관리자', data.admin],
            ['요청 시간', date(data.requestedAt)], ['최종 변경 시간', date(data.updatedAt)], ['완료 시간', date(data.completedAt)],
            ['상품 복귀', data.itemReturnRequired ? (data.itemReturnedAt ? '복귀 확인 완료' : '복귀 확인 대기') : '복귀 확인 불필요'],
            ['복귀 확인 시간', date(data.itemReturnedAt)], ['선점 해제 시간', date(data.reservationReleasedAt)]
        ]);
        if (data.cancelStatus !== '취소 처리 완료' && data.cancelStatus !== 'COMPLETE') {
            const actions = document.createElement('div');
            actions.className = 'cancel-actions';
            const note = document.createElement('p');
            note.id = 'cancel-process-note';
            note.textContent = '취소 처리 기능 준비 중';
            const processButton = document.createElement('button');
            processButton.type = 'button';
            processButton.className = 'cancel-process';
            processButton.textContent = '취소 처리';
            processButton.dataset.cancelId = data.cancelId;
            processButton.disabled = true;
            processButton.setAttribute('aria-describedby', note.id);
            // 실제 취소 처리 API 구현 후 연결합니다. 상세 조회 API를 호출하지 않습니다.
            // 연결 시 processButton.dataset.processUrl에 처리 경로를 지정하고 활성화합니다.
            processButton.addEventListener('click', async () => {
                if (processButton.disabled) return;
                const confirmed = window.confirm(
                    `주문번호 ${data.orderNumber ?? data.orderId}의 취소 처리를 진행하시겠습니까?`
                );
                if (!confirmed) return;
                const processUrl = processButton.dataset.processUrl;
                if (!processUrl) {
                    note.textContent = '취소 처리 기능 준비 중입니다.';
                    return;
                }
                processButton.disabled = true;
                processButton.textContent = '처리 중…';
                note.textContent = '취소 처리를 요청하고 있습니다.';
                try {
                    const response = await fetch(processUrl, {
                        method: 'POST',
                        headers: {Accept: 'application/json'},
                        credentials: 'same-origin'
                    });
                    if (response.redirected || response.status === 401 || response.status === 403) {
                        throw new Error('로그인 상태와 관리자 권한을 확인해주세요.');
                    }
                    const result = (response.headers.get('content-type') || '').includes('application/json')
                        ? await response.json() : null;
                    if (!response.ok || result?.result === 'N') {
                        throw new Error(result?.message || '취소 처리 요청에 실패했습니다.');
                    }
                    // 요청 성공을 환불 완료로 간주하지 않고 서버의 최신 상태를 다시 조회합니다.
                    window.location.reload();
                } catch (error) {
                    note.textContent = error instanceof TypeError
                        ? '처리 결과를 확인할 수 없습니다. 새로고침하여 상태를 확인해주세요.'
                        : error.message;
                    processButton.textContent = '처리 상태 확인 필요';
                    // 응답 유실 시 중복 환불 요청을 피하기 위해 바로 재실행하지 않습니다.
                }
            });
            actions.append(note, processButton);
            content.append(actions);
        }
        section('회원 및 주문', [
            ['회원 ID', data.member?.memberId], ['회원 이름', data.member?.memberName],
            ['주문 시간', date(data.order?.orderedAt)], ['주문 총금액', money(data.order?.totalPrice)]
        ]);
        const heading = document.createElement('h3');
        heading.textContent = '주문 상품';
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        const table = document.createElement('table');
        const head = table.createTHead().insertRow();
        ['상품명', '브랜드', 'SKU', '수량', '단가', '합계'].forEach(label => {
            const th = document.createElement('th'); th.scope = 'col'; th.textContent = label; head.append(th);
        });
        const body = table.createTBody();
        const items = data.order?.items || [];
        items.forEach(item => {
            const row = body.insertRow();
            [item.productName, item.brandName, item.sku, item.quantity, money(item.unitPrice), money(item.totalPrice)]
                .forEach(value => { row.insertCell().textContent = display(value); });
        });
        if (!items.length) { const cell = body.insertRow().insertCell(); cell.colSpan = 6; cell.textContent = '표시할 상품이 없습니다.'; }
        wrap.append(table); content.append(heading, wrap);
        const delivery = data.delivery || {};
        section('수령인 및 배송지', [
            ['수령인', delivery.recipientName], ['연락처', delivery.recipientPhone], ['우편번호', delivery.zipCode],
            ['주소', delivery.address], ['상세 주소', delivery.addressDetail],
            ['택배사', delivery.deliveryCompany === 'CJ' ? 'CJ대한통운' : delivery.deliveryCompany], ['운송장', delivery.trackingNumber]
        ]);
        const payment = data.payment || {};
        section('결제 및 환불', [
            ['결제 ID', payment.paymentId], ['결제 상태', payment.paymentStatus], ['결제 수단', payment.paymentMethodLabel],
            ['결제 금액', money(payment.paidAmount)], ['결제 처리 시간', date(payment.paidAt)],
            ['환불 상태', payment.refundStatus ?? '미확인'], ['환불 금액', money(payment.refundedAmount)], ['환불 시간', date(payment.refundedAt)]
        ]);
    }
    async function loadDetail() {
        requestController?.abort();
        const controller = new AbortController();
        requestController = controller;
        content.replaceChildren(); retry.hidden = true;
        message.textContent = '상세정보를 불러오는 중입니다.';
        content.setAttribute('aria-busy', 'true');
        try {
            const response = await fetch(activeButton.dataset.detailUrl, {
                method: 'GET', headers: {Accept: 'application/json'}, credentials: 'same-origin',
                cache: 'no-store', signal: controller.signal
            });
            if (response.redirected || response.status === 401 || response.status === 403) {
                throw new Error('로그인 상태와 관리자 권한을 확인해주세요.');
            }
            const data = (response.headers.get('content-type') || '').includes('application/json') ? await response.json() : null;
            if (!response.ok || data?.result === 'N') throw new Error(data?.message || '상세 조회에 실패했습니다.');
            if (!data || String(data.cancelId) !== activeButton.dataset.cancelId) throw new Error('상세정보 응답을 확인할 수 없습니다.');
            if (controller.signal.aborted) return;
            render(data); message.textContent = '';
        } catch (error) {
            if (controller.signal.aborted) return;
            content.replaceChildren();
            message.textContent = error instanceof TypeError ? '서버 연결 또는 응답을 확인할 수 없습니다.' : error.message;
            retry.hidden = false;
        } finally {
            if (!controller.signal.aborted) content.setAttribute('aria-busy', 'false');
        }
    }
    document.querySelectorAll('.detail-button').forEach(button => {
        button.addEventListener('click', () => { activeButton = button; dialog.showModal(); loadDetail(); });
    });
    retry.addEventListener('click', loadDetail);
    dialog.addEventListener('close', () => { requestController?.abort(); content.replaceChildren(); activeButton?.focus(); });
</script>
</body>
</html>
