<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://js.tosspayments.com/v2/standard"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>배송/결제</title>
</head>
<body>
<header class="top-bar">
    <div class="top-bar__inner">
        <a class="back-button" href="#" aria-label="이전 화면으로 이동">‹</a>
        <h1>배송/결제</h1>
        <span class="top-bar__spacer" aria-hidden="true"></span>
    </div>
</header>

<main class="page" th:object="${orderSheet}">
    <section class="section" aria-labelledby="address-title">
        <div class="section-heading">
            <h2 id="address-title">배송 주소</h2>
            <button class="outline-button" type="button">주소 변경</button>
        </div>

        <div class="card address-card">
            <dl class="address-list">
                <div>
                    <dt>받는 분</dt>
                    <dd th:text="*{receiver.name}">홍길동</dd>
                </div>
                <div>
                    <dt>연락처</dt>
                    <dd th:text="*{receiver.phone}">01012345678</dd>
                </div>
                <div>
                    <dt>주소</dt>
                    <dd>
                        <span th:text="|[${orderSheet.receiver.zipCode}] ${orderSheet.receiver.address} ${orderSheet.receiver.addressDetail}|">[01234] 서울 압구정구 211 123-1234</span>
                    </dd>
                </div>
            </dl>

            <button class="request-row" type="button" aria-label="배송 요청사항 변경">
                <span th:text="*{receiver.deliveryRequestMessage != null and !receiver.deliveryRequestMessage.isBlank()
                    ? receiver.deliveryRequestMessage
                    : (receiver.receiverMethod == 'DOOR' ? '문 앞에 놓아주세요' : '배송 요청사항 없음')}">문 앞에 놓아주세요</span>
                <span class="chevron" aria-hidden="true">›</span>
            </button>
        </div>
    </section>

    <section class="section" aria-labelledby="product-title">
        <div class="section-heading">
            <h2 id="product-title">주문 상품</h2>
            <strong class="item-count">총 1건</strong>
        </div>

        <article class="card product-card">
            <div class="product-summary">
                <div class="product-image" role="img" aria-label="상품 이미지 영역"></div>
                <div class="product-info">
                    <p class="product-name" th:text="*{orderSheetProductDto.variantName}">아이앱 스튜디오 후드 라이트 그레이</p>
                    <p class="product-meta">
                        <span th:text="|상품 번호 ${orderSheet.orderSheetProductDto.productId}|">상품 번호 1</span>
                        <span class="divider" aria-hidden="true"></span>
                        <span th:text="|옵션 번호 ${orderSheet.orderSheetProductDto.optionId}|">옵션 번호 1</span>
                    </p>
                    <p class="product-option" th:text="|${orderSheet.orderSheetProductDto.size} 사이즈|">M 사이즈</p>
                </div>
                <strong class="product-price" th:text="|${#numbers.formatInteger(orderSheet.orderSheetProductDto.productPrice, 0, 'COMMA')}원|">110,000원</strong>
            </div>
        </article>
    </section>

    <section class="section" aria-labelledby="discount-title">
        <div class="section-heading">
            <h2 id="discount-title">할인 및 포인트</h2>
        </div>

        <div class="card discount-card">
            <div class="field-group">
                <label for="coupon">쿠폰</label>
                <div class="field-row">
                    <div class="input-like input-like--disabled" id="coupon" aria-disabled="true">사용 가능한 쿠폰이 없습니다.</div>
                    <button class="small-button" type="button" disabled>쿠폰 선택</button>
                </div>
            </div>

            <div class="field-group">
                <label for="pointAmount">포인트</label>
                <div class="field-row">
                    <input id="pointAmount" type="number" min="0" value="0" inputmode="numeric" aria-describedby="point-help">
                    <button class="small-button" type="button" disabled>최대 사용</button>
                </div>
                <p class="field-help" id="point-help">보유 포인트 <strong>0P</strong></p>
            </div>
        </div>
    </section>

    <section class="section" aria-labelledby="payment-title">
        <div class="section-heading">
            <h2 id="payment-title">결제 방법</h2>
        </div>

        <fieldset class="card payment-card">
            <legend class="sr-only">결제 방법을 선택하세요</legend>
            <label class="payment-option">
                <input type="radio" name="paymentMethod" value="SAVED_ACCOUNT" checked>
                <span class="radio-mark" aria-hidden="true"></span>
                <span><strong>계좌 간편결제</strong></span>
            </label>
            <label class="payment-option">
                <input type="radio" name="paymentMethod" value="SAVED_CARD">
                <span class="radio-mark" aria-hidden="true"></span>
                <span><strong>카드 간편결제</strong></span>
            </label>
            <label class="payment-option">
                <input type="radio" name="paymentMethod" value="TOSS">
                <span class="radio-mark" aria-hidden="true"></span>
                <span>
                    <strong>일반 결제(일시불·할부)</strong>
                </span>
            </label>
            <!-- 결제 UI -->
            <div id="payment-method" style = "display:none"></div>
            <!-- 이용약관 UI -->
            <div id="agreement" style="display:none"></div>
            <!-- 결제하기 버튼 -->
            <button class="button" id="payment-button" style="margin-top: 30px">결제하기</button>

        </fieldset>
    </section>

    <section class="section final-section" aria-labelledby="summary-title">
        <div class="section-heading">
            <h2 id="summary-title">최종 주문정보</h2>
        </div>

        <div class="card summary-card">
            <dl class="price-list">
                <div>
                    <dt>상품 금액</dt>
                    <dd th:text="|${#numbers.formatInteger(orderSheet.orderSheetPriceDto.productTotalPrice, 0, 'COMMA')}원|">110,000원</dd>
                </div>
                <div>
                    <dt>배송비</dt>
                    <dd th:text="|${#numbers.formatInteger(orderSheet.orderSheetPriceDto.deliveryPrice, 0, 'COMMA')}원|">5,000원</dd>
                </div>
                <div>
                    <dt>쿠폰 할인</dt>
                    <dd th:text="|-${#numbers.formatInteger(orderSheet.orderSheetPriceDto.couponAmount, 0, 'COMMA')}원|">-0원</dd>
                </div>
                <div>
                    <dt>포인트 사용</dt>
                    <dd th:text="|-${#numbers.formatInteger(orderSheet.orderSheetPriceDto.pointAmount, 0, 'COMMA')}원|">-0원</dd>
                </div>
            </dl>
            <div class="total-price">
                <strong>총 결제금액</strong>
                <strong th:text="|${#numbers.formatInteger(orderSheet.orderSheetPriceDto.paymentAmount, 0, 'COMMA')}원|">115,000원</strong>
            </div>
        </div>
    </section>

</main>

<script>
    // ------ 전역 상태 ------
    let widgets;
    let widgetRendered = false;
    let prepared; // 서버에서 받은 최신 결제 정보(금액, 주문번호 등)

    const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
    const tossPayments = TossPayments(clientKey);
    widgets = tossPayments.widgets({ customerKey: TossPayments.ANONYMOUS });

    const variantId = [[${orderSheet.orderSheetProductDto.variantId}]];
    const optionId = [[${orderSheet.orderSheetProductDto.optionId}]];
    const orderNameFromOrderSheet = /*[[${orderSheet.orderSheetProductDto.variantName}]]*/ "상품명";
    const receiverNameFromOrderSheet = /*[[${orderSheet.receiver.name}]]*/ "구매자";
    const receiverPhoneFromOrderSheet = /*[[${orderSheet.receiver.phone}]]*/ "01000000000";

    init();

    function init() {
        // 라디오 변경 이벤트 등록
        document.querySelectorAll("input[name='paymentMethod']").forEach(radio => {
            radio.addEventListener("change", (e) => handlePaymentMethodChange(e.target.value));
        });

        // 버튼 클릭 리스너는 여기서 딱 한 번만 등록
        document.getElementById("payment-button").addEventListener("click", onPaymentButtonClick);

        // 최초 로드 시 기본 선택값 반영 (지금은 SAVED_ACCOUNT가 기본이라 TOSS 위젯은 숨김 상태 유지)
        const initialChecked = document.querySelector("input[name='paymentMethod']:checked").value;
        handlePaymentMethodChange(initialChecked);
    }

    async function handlePaymentMethodChange(method) {
        const paymentMethodDiv = document.getElementById("payment-method");
        const agreementDiv = document.getElementById("agreement");

        if (method === "TOSS") {
            paymentMethodDiv.style.display = "block";
            agreementDiv.style.display = "block";
            await tossPaymentWidget();
        } else {
            paymentMethodDiv.style.display = "none";
            agreementDiv.style.display = "none";
        }
    }

    async function tossPaymentWidget() {
        // 실제로 결제하기 위한 데이터(사용자 정보, 최종 결제 금액 서버에서 조회)
        const paymentRequestDto = {
            receiver: {
                name: /*[[${orderSheet.receiver.name}]]*/ "구매자",
                phone: /*[[${orderSheet.receiver.phone}]]*/ "01000000000",
                zipCode: /*[[${orderSheet.receiver.zipCode}]]*/ "00000",
                address: /*[[${orderSheet.receiver.address}]]*/ "주소",
                addressDetail: /*[[${orderSheet.receiver.addressDetail}]]*/ "",
                receiverMethod: /*[[${orderSheet.receiver.receiverMethod}]]*/ "DOOR",
                deliveryRequestMessage: /*[[${orderSheet.receiver.deliveryRequestMessage}]]*/ null
            },
            couponId: null,
            usedPoint: Number(document.getElementById("pointAmount").value || 0),
            paymentMethod: "TOSS",
            savedAccountId: null,
            savedCardId: null,
            cardCompany: null,
            installmentMonths: 0
        };

        // 서버에서 사용자 정보 및 최종 결제 금액 요청 (선택할 때마다 최신화)
        const prepareResponse = await fetch(`/api/pay/${variantId}?optionId=${optionId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(paymentRequestDto)
        });

        prepared = await prepareResponse.json();

        // ------ 주문의 결제 금액 설정 (항상 최신화) ------
        await widgets.setAmount({
            currency: "KRW",
            value: prepared.amount
        });

        // ------ 위젯 렌더링은 최초 1회만 ------
        if (!widgetRendered) {
            await Promise.all([
                widgets.renderPaymentMethods({
                    selector: "#payment-method",
                    variantKey: "DEFAULT",
                }),
                widgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" }),
            ]);
            widgetRendered = true;
        }
    }

    // ------ '결제하기' 버튼 누르면 결제창 띄우기 ------
    async function onPaymentButtonClick() {
        const method = document.querySelector("input[name='paymentMethod']:checked").value;

        if (method === "TOSS") {
            await widgets.requestPayment({
                orderId: prepared.orderNumber,
                orderName: orderNameFromOrderSheet,
                successUrl: window.location.origin + "/api/toss/pay/success",
                failUrl: window.location.origin + "/api/pay/toss/fail",
                customerName: receiverNameFromOrderSheet,
                customerMobilePhone: receiverPhoneFromOrderSheet
            });
        } else {
            // TODO: SAVED_ACCOUNT / SAVED_CARD 결제 로직
            // savedAccountId / savedCardId를 담아 /api/pay/... 재요청 후 결제 처리
        }
    }
</script>
</body>
</html>
