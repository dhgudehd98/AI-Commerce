<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>출고 목록</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f5f6f8; color: #253041; font-family: system-ui, sans-serif; }
        main { max-width: 1100px; margin: 48px auto; padding: 0 20px; }
        h1 { margin: 0 0 8px; font-size: 26px; }
        .description { margin: 0 0 28px; color: #667085; }
        .panel { background: white; border: 1px solid #e1e5eb; border-radius: 10px; overflow: hidden; }
        .toolbar, .pagination { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px; flex-wrap: wrap; }
        form, .links { display: flex; align-items: center; gap: 8px; }
        input, button, .links a, .disabled { padding: 8px 12px; border: 1px solid #d6dce5; border-radius: 6px; background: white; color: inherit; font: inherit; }
        input { width: 80px; }
        button, .links a { cursor: pointer; text-decoration: none; }
        button:hover, .links a:hover { background: #f0f3f8; }
        .disabled { color: #9299a5; background: #f7f8fa; }
        .table-wrap { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; white-space: nowrap; font-size: 14px; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #edf0f4; }
        th { background: #f8f9fb; color: #667085; font-weight: 600; }
        .badge { display: inline-block; padding: 4px 9px; border-radius: 5px; background: #eef2f7; }
        .requested { color: #b54708; }
        .empty { padding: 56px 16px; text-align: center; color: #667085; }
        .page-info { color: #667085; font-size: 14px; }
        .detail-row td { background: #f8f9fb; white-space: normal; }
        .detail-row h2 { margin: 0 0 16px; font-size: 16px; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin: 0; }
        .detail-grid dt { margin-bottom: 6px; font-size: 13px; color: #667085; }
        .detail-grid dd { margin: 0; overflow-wrap: anywhere; }
        @media (max-width: 600px) { main { margin: 24px auto; } .toolbar, .pagination { padding: 16px; } }
    </style>
</head>
<body>
<main>
    <h1>출고 목록</h1>
    <p class="description">전체 출고 내역을 등록일 최신순으로 확인합니다.</p>
    <section class="panel" aria-label="출고 내역">
        <div class="toolbar">
            <div>전체 <strong th:text="${outboundList.totalElements}">0</strong>건</div>
            <form method="get" th:action="@{/api/admin/outbounds}">
                <input type="hidden" name="page" value="0">
                <label for="size">페이지당</label>
                <input id="size" name="size" type="number" min="1" required th:value="${outboundList.size}">
                <span>건</span>
                <button type="submit">조회</button>
            </form>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th scope="col">출고 ID</th>
                    <th scope="col">출고 번호</th>
                    <th scope="col">주문 번호</th>
                    <th scope="col">출고 상태</th>
                    <th scope="col">총수량</th>
                    <th scope="col">등록일</th>
                    <th scope="col">취소 요청</th>
                    <th scope="col">상세정보</th>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="outbound, row : ${outboundList.content}">
                <tr>
                    <td th:text="${outbound.outboundId}">1</td>
                    <td th:text="${outbound.outboundNumber}">OUT-001</td>
                    <td th:text="${outbound.orderNumber}">ORDER-001</td>
                    <td><span class="badge" th:text="${outbound.outboundStatus}">출고 대기</span></td>
                    <td th:text="${outbound.totalQuantity}">0</td>
                    <td th:text="${outbound.createdAt != null ? #temporals.format(outbound.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                    <td th:text="${outbound.cancellationRequested ? '요청됨' : '-'}"
                        th:classappend="${outbound.cancellationRequested ? 'requested' : ''}">-</td>
                    <td>
                        <button type="button" class="detail-toggle" aria-expanded="false"
                                th:attr="aria-controls=|outbound-detail-${row.index}|,aria-label=|출고 ${outbound.outboundNumber} 상세보기|">상세보기</button>
                    </td>
                </tr>
                <tr class="detail-row" th:id="|outbound-detail-${row.index}|" hidden>
                    <td colspan="8">
                        <h2>출고 상세정보</h2>
                        <dl class="detail-grid">
                            <div><dt>출고 ID</dt><dd th:text="${outbound.outboundId}">-</dd></div>
                            <div><dt>출고 번호</dt><dd th:text="${outbound.outboundNumber}">-</dd></div>
                            <div><dt>주문 번호</dt><dd th:text="${outbound.orderNumber}">-</dd></div>
                            <div><dt>출고 상태</dt><dd th:text="${outbound.outboundStatus}">-</dd></div>
                            <div><dt>총 출고 수량</dt><dd th:text="|${outbound.totalQuantity}개|">-</dd></div>
                            <div><dt>등록일</dt><dd th:text="${outbound.createdAt != null ? #temporals.format(outbound.createdAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</dd></div>
                            <div><dt>취소 요청</dt><dd th:text="${outbound.cancellationRequested ? '요청됨' : '없음'}">-</dd></div>
                        </dl>
                    </td>
                </tr>
                </th:block>
                <tr th:if="${outboundList.empty}">
                    <td colspan="8" class="empty">이 페이지에 표시할 출고 내역이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav class="pagination" aria-label="출고 목록 페이지 이동">
            <span class="page-info" th:text="|현재 ${outboundList.number + 1}페이지 · 전체 ${outboundList.totalPages}페이지|">현재 1페이지 · 전체 0페이지</span>
            <div class="links">
                <a th:if="${outboundList.hasPrevious()}" th:href="@{/api/admin/outbounds(page=0, size=${outboundList.size})}">처음</a>
                <a th:if="${outboundList.hasPrevious()}" th:href="@{/api/admin/outbounds(page=${outboundList.number - 1}, size=${outboundList.size})}">이전</a>
                <span th:unless="${outboundList.hasPrevious()}" class="disabled" aria-disabled="true">이전</span>
                <a th:if="${outboundList.hasNext()}" th:href="@{/api/admin/outbounds(page=${outboundList.number + 1}, size=${outboundList.size})}">다음</a>
                <span th:unless="${outboundList.hasNext()}" class="disabled" aria-disabled="true">다음</span>
            </div>
        </nav>
    </section>
</main>
<script>
    document.querySelectorAll('.detail-toggle').forEach(button => {
        button.addEventListener('click', () => {
            const detail = document.getElementById(button.getAttribute('aria-controls'));
            if (!detail) return;
            const expanded = button.getAttribute('aria-expanded') === 'true';
            detail.hidden = expanded;
            button.setAttribute('aria-expanded', String(!expanded));
            button.textContent = expanded ? '상세보기' : '상세닫기';
        });
    });
</script>
</body>
</html>
